# Default values for giskard-wb-api.

# The server keeps run state in SQLite on a single volume, so exactly one
# replica is supported (the Deployment uses the Recreate strategy).
replicaCount: 1

image:
  repository: ghcr.io/your-org/giskard-wb-api
  pullPolicy: IfNotPresent
  # Defaults to the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Port the server listens on inside the pod (rendered into the config as server.port).
containerPort: 8080

# -----------------------------------------------------------------------------
# Server configuration, rendered into a ConfigMap as config.yaml and mounted at
# /etc/giskard-wb-api/config.yaml. Same layout as config.example.yaml in the
# repository; unknown keys make the server refuse to start.
# server.host, server.port, server.database_path, secrets_dir and (unless set
# here) skypilot.api_server_endpoint are set by the chart.
# Do NOT put credentials here; use `secrets` below.
# -----------------------------------------------------------------------------
config:
  server:
    log_level: info
    # Browser origins allowed by CORS (e.g. the Giskard web UI).
    cors_allowed_origins: []

  # Access tokens for this API.
  oidc:
    issuer: ""               # required, e.g. https://auth.example.com/realms/giskard
    audience: []             # required, e.g. [giskard-api]
    # jwks_uri: ""
    algorithms: [RS256, PS256, ES256]
    clock_tolerance_seconds: 30
    # required_scope: giskard:runs
    # admin_scope: giskard:admin
    admin_role: giskard-admin
    roles_claim: realm_access.roles
    require_at_jwt_type: false

  minio:
    endpoint: ""             # required, e.g. http://minio.minio.svc:9000
    # public_endpoint: https://minio.example.com   # host in presigned download links
    # job_endpoint: https://minio.example.com      # must be reachable from Lambda.ai
    region: us-east-1
    force_path_style: true

  storage:
    allowed_trainer_locations: []   # required, e.g. [giskard-artifacts/wheels]
    allowed_dataset_locations: []   # required, e.g. [giskard-datasets]
    allowed_config_locations: []
    results_location: ""            # required, e.g. giskard-results/runs
    presign_ttl_seconds: 900

  runs:
    gpus:
      H100: [1, 2, 4, 8]
      A100-80GB: [1, 2, 4, 8]
      A10: [1]
    max_runtime_minutes: 1440
    stop_grace_seconds: 600
    status_poll_interval_seconds: 30
    max_inline_config_bytes: 262144

  skypilot:
    # Leave empty to use the SkyPilot API server deployed by this chart
    # (skypilot.enabled); set it when using an existing SkyPilot deployment.
    api_server_endpoint: ""
    infra: lambda
    # region: us-east-1
    disk_size_gb: 256
    job_name_prefix: giskard
    request_timeout_seconds: 120
    threads: 8
    launch_timeout_seconds: 1800

# -----------------------------------------------------------------------------
# Credentials, mounted as files at /etc/giskard-wb-api/secrets (the server's
# secrets_dir). Each Secret key is the config key it sets:
#   minio.access_key, minio.secret_key            required
#   minio.job_access_key, minio.job_secret_key    optional (default: the server's key)
#   skypilot.service_account_token                only when the SkyPilot API server
#                                                 enforces authentication (see skypilot.auth)
# Either reference an existing Secret (recommended; e.g. managed by
# external-secrets or sealed-secrets) or let the chart create one from `values`.
# -----------------------------------------------------------------------------
secrets:
  existingSecret: ""
  create: true
  values: {}
    # minio.access_key: ""
    # minio.secret_key: ""
    # minio.job_access_key: ""
    # minio.job_secret_key: ""
    # skypilot.service_account_token: ""

# SQLite database volume (mounted at /data).
persistence:
  enabled: true
  existingClaim: ""
  storageClass: ""
  accessModes: [ReadWriteOnce]
  size: 1Gi
  annotations: {}

serviceAccount:
  create: true
  # The server does not call the Kubernetes API.
  automount: false
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000      # the `app` user in the image
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

service:
  type: ClusterIP
  port: 80

# Ingress with TLS certificates from cert-manager.
ingress:
  enabled: true
  className: nginx
  annotations:
    # Log retrieval goes through SkyPilot and can take longer than the default 60 s.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "180"
  certManager:
    enabled: true
    # Name of the cert-manager issuer and whether it is a ClusterIssuer or a namespaced Issuer.
    issuer: letsencrypt-prod
    issuerKind: ClusterIssuer
  hosts:
    - host: ""               # required when ingress is enabled, e.g. giskard-api.example.com
      paths:
        - path: /
          pathType: Prefix
  # When empty and certManager is enabled, one TLS entry covering all hosts is
  # generated with secretName <fullname>-tls.
  tls: []
    # - secretName: giskard-wb-api-tls
    #   hosts:
    #     - giskard-api.example.com

# Alternative to Ingress: Gateway API HTTPRoute.
httpRoute:
  enabled: false
  annotations: {}
  parentRefs:
  - name: gateway
    sectionName: https
  hostnames: []
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 1Gi

livenessProbe:
  httpGet:
    path: /healthz
    port: http
  periodSeconds: 20
  timeoutSeconds: 5
readinessProbe:
  httpGet:
    path: /healthz
    port: http
  periodSeconds: 10
  timeoutSeconds: 5
startupProbe:
  httpGet:
    path: /healthz
    port: http
  periodSeconds: 5
  failureThreshold: 24

volumes: []
volumeMounts: []

nodeSelector: {}
tolerations: []
affinity: {}

# -----------------------------------------------------------------------------
# SkyPilot API server (subchart: https://helm.skypilot.co, chart "skypilot").
# giskard-wb-api submits and tracks training jobs through it; it holds the Lambda.ai
# credentials and runs the managed-jobs controller. All keys under `skypilot`
# are passed to the subchart; see its values.yaml for the full reference.
# -----------------------------------------------------------------------------

# Lambda.ai API key for SkyPilot. When `create` is true the chart creates the
# Secret named by skypilot.lambdaCredentials.lambdaSecretName (key `api_key`);
# otherwise create it yourself:
#   kubectl create secret generic lambda-credentials --from-literal api_key=<key>
lambdaCredentials:
  create: false
  apiKey: ""

# Restrict access to the SkyPilot API server to giskard-wb-api pods (plus any extra
# peers, e.g. your ingress controller if the SkyPilot dashboard is exposed).
# Important when SkyPilot authentication is not enabled: in-cluster requests to
# its Service are otherwise unauthenticated. Requires a CNI that enforces
# NetworkPolicy. Off by default (single-tenant cluster); turn it on when other
# workloads share the cluster.
networkPolicy:
  enabled: false
  skypilotApiExtraFrom: []
    # - namespaceSelector:
    #     matchLabels:
    #       kubernetes.io/metadata.name: ingress-nginx

skypilot:
  enabled: true

  apiService:
    # Initial ~/.sky/config.yaml (ignored on upgrade once the server has a config;
    # edit it from the SkyPilot dashboard afterwards).
    # consolidation_mode runs the managed-jobs controller inside the API server
    # pod. Without it SkyPilot would launch the controller as a separate VM on
    # Lambda.ai, which only offers (always-on, billed) GPU instances.
    config: |
      allowed_clouds:
        - lambda
      jobs:
        controller:
          consolidation_mode: true
    # The subchart requires >= 4 CPU / 8 GiB by default.
    # resources:
    #   requests: {cpu: "4", memory: 8Gi}
    #   limits: {cpu: "4", memory: 8Gi}

  lambdaCredentials:
    enabled: true
    lambdaSecretName: lambda-credentials

  # Only Lambda.ai is used; do not schedule SkyPilot workloads on this cluster.
  kubernetesCredentials:
    useApiServerCluster: false
  rbac:
    # SkyPilot only needs Kubernetes permissions to run workloads on this cluster,
    # which is disabled above (its pod gets no API token). Skip its ClusterRole /
    # Role bindings, so installing needs only namespace-level rights; this chart
    # creates the plain ServiceAccount (<release>-api-sa) the SkyPilot pod uses.
    create: false
    manageSystemComponents: false

  # Do not install SkyPilot's own ingress-nginx controller (with a LoadBalancer).
  ingress-nginx:
    enabled: false

  # The SkyPilot dashboard/API is not exposed outside the cluster by default.
  # To expose it, enable the ingress together with in-server OIDC auth, e.g.:
  #   ingress:
  #     enabled: true
  #     host: skypilot.example.com
  #     ingressClassName: nginx
  #     annotations:
  #       cert-manager.io/cluster-issuer: letsencrypt-prod
  #     tls:
  #       enabled: true
  #   auth:
  #     oauth:
  #       enabled: true
  #       oidc-issuer-url: https://auth.example.com/realms/giskard
  #       client-details-from-secret: skypilot-oauth-client
  #       use-https: true
  # and allow the ingress controller in networkPolicy.skypilotApiExtraFrom.
  # With auth enabled, create a SkyPilot service account token for giskard-wb-api
  # and store it as skypilot.service_account_token in giskard-wb-api's Secret.
  ingress:
    enabled: false

  auth:
    serviceAccount:
      enabled: true
