{{- if and .Values.secrets.create (not .Values.secrets.existingSecret) }}
{{- $required := list "minio.access_key" "minio.secret_key" }}
{{- range $required }}
{{- if empty (get $.Values.secrets.values .) }}
{{- fail (printf "secrets.values.\"%s\" is required (or set secrets.existingSecret)" .) }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "giskard-wb-api.secretName" . }}
  labels:
    {{- include "giskard-wb-api.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $key, $value := .Values.secrets.values }}
  {{- if $value }}
  {{ $key }}: {{ $value | toString | quote }}
  {{- end }}
  {{- end }}
{{- end }}
