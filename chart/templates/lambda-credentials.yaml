{{- if and .Values.skypilot.enabled .Values.lambdaCredentials.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.skypilot.lambdaCredentials.lambdaSecretName }}
  labels:
    {{- include "giskard-wb-api.labels" . | nindent 4 }}
type: Opaque
stringData:
  api_key: {{ required "lambdaCredentials.apiKey is required when lambdaCredentials.create is true" .Values.lambdaCredentials.apiKey | quote }}
{{- end }}
