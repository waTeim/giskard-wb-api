{{- if ne (int .Values.replicaCount) 1 }}
{{- fail "replicaCount must be 1: run state is kept in a single SQLite volume" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "giskard-wb-api.fullname" . }}
  labels:
    {{- include "giskard-wb-api.labels" . | nindent 4 }}
spec:
  replicas: 1
  # Never run two servers against the same database / job tracking.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "giskard-wb-api.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include "giskard-wb-api.config" . | sha256sum }}
        {{- if and .Values.secrets.create (not .Values.secrets.existingSecret) }}
        checksum/secret: {{ toYaml .Values.secrets.values | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "giskard-wb-api.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "giskard-wb-api.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # Allow in-flight SkyPilot calls to finish; tracking resumes on restart anyway.
      terminationGracePeriodSeconds: 30
      containers:
        - name: {{ .Chart.Name }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: [--config, /etc/giskard-wb-api/config.yaml]
          ports:
            - name: http
              containerPort: {{ .Values.containerPort }}
              protocol: TCP
          {{- with .Values.startupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            # subPath keeps /etc/giskard-wb-api free for the secrets mount. A
            # subPath file is not refreshed in place; config changes roll the
            # pod instead (checksum/config annotation).
            - name: config
              mountPath: /etc/giskard-wb-api/config.yaml
              subPath: config.yaml
              readOnly: true
            - name: secrets
              mountPath: /etc/giskard-wb-api/secrets
              readOnly: true
            - name: data
              mountPath: /data
            # Writable scratch space with a read-only root filesystem
            # (SkyPilot client state in ~/.sky, Python temp files).
            - name: home
              mountPath: /home/app
            - name: tmp
              mountPath: /tmp
            {{- with .Values.volumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "giskard-wb-api.fullname" . }}
        - name: secrets
          secret:
            secretName: {{ include "giskard-wb-api.secretName" . }}
            defaultMode: 0400
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "giskard-wb-api.pvcName" . }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: home
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        {{- with .Values.volumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
