{{- if and .Values.skypilot.enabled (not .Values.skypilot.rbac.create) (not .Values.skypilot.rbac.serviceAccountName) }}
# ServiceAccount for the SkyPilot API server pod when the subchart's RBAC is disabled.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "giskard-wb-api.skypilotFullname" . }}-api-sa
  labels:
    {{- include "giskard-wb-api.labels" . | nindent 4 }}
automountServiceAccountToken: false
{{- end }}
